# Configuración de validación cinemática para teleoperación YAREN
# Este archivo define los parámetros antropométricos y límites articulares
# que se usan para validar y corregir el mapeo de ángulos humano-robot

# ============================================================================
# PARÁMETROS ANTROPOMÉTRICOS HUMANOS
# ============================================================================
# Estos valores representan los rangos esperados para longitudes de miembros
# humanos. Si una longitud cae fuera de estos rangos, se descarta como
# distorsión perspectiva de la cámara.

human_limb_parameters:
  # Brazo superior (hombro a codo)
  upper_arm:
    min_length: 0.25  # metros
    max_length: 0.35  # metros
    
  # Antebrazo (codo a muñeca)
  forearm:
    min_length: 0.20  # metros
    max_length: 0.30  # metros
  
  # Tolerancia de profundidad (Z) entre frames
  # Si la profundidad cambia más de esto entre frames consecutivos,
  # se rechaza como error de perspectiva
  depth_validity_threshold: 0.05  # metros (5 cm)

# ============================================================================
# LÍMITES ARTICULARES DEL ROBOT
# ============================================================================
# Definición de límites mecánicos para cada articulación

robot_joint_limits:
  # Torso
  joint_2:
    name: "torso_tilt"
    min: -0.3      # radianes
    max: 0.3       # radianes
  
  # BRAZO DERECHO
  joint_5:
    name: "right_shoulder_azimuth"
    min: -0.75
    max: 1.50
    description: "Rotación horizontal del hombro (izquierda-derecha)"
  
  joint_6:
    name: "right_shoulder_elevation"
    min: 0.05
    max: 0.9848
    description: "Elevación del hombro (arriba-abajo)"
  
  joint_7:
    name: "right_elbow_rotation"
    min: -0.6981
    max: 0.6981
    description: "Rotación del codo"
  
  joint_8:
    name: "right_wrist_elevation"
    min: 0.15
    max: 1.50
    description: "Elevación de la muñeca"
  
  # BRAZO IZQUIERDO (espejo del derecho)
  joint_9:
    name: "left_shoulder_azimuth"
    min: -0.75
    max: 1.50
  
  joint_10:
    name: "left_shoulder_elevation"
    min: 0.05
    max: 0.9848
  
  joint_11:
    name: "left_elbow_rotation"
    min: -0.6981
    max: 0.6981
  
  joint_12:
    name: "left_wrist_elevation"
    min: 0.15
    max: 1.50

# ============================================================================
# RESTRICCIONES CINEMÁTICAS INTERDEPENDIENTES
# ============================================================================
# Estas restricciones modelan las dependencias mecánicas entre articulaciones.
# Por ejemplo: cuando el hombro está muy bajo, el azimuth tiene rango limitado
# para evitar colisiones con el cuerpo.

kinematic_constraints:
  
  # Restricción 1: Cuando elevación está muy baja
  low_elevation:
    threshold: 0.2  # radianes (si elevation < 0.2, aplica restricción)
    azimuth_min: -0.3
    azimuth_max: 0.3
    reason: "Evita colisión con el cuerpo del robot"
  
  # Restricción 2: Rango de seguridad para elevación
  minimum_elevation: 0.05  # Nunca permitir elevación < esto
  maximum_elevation: 0.9   # Antes de singularidad
  
  # Restricción 3: Cuando codo está en extremo
  extreme_elbow:
    threshold: 0.5  # radianes (si |elbow| > 0.5, aplica restricción)
    wrist_min: 0.25
    wrist_max: 1.2
    reason: "Estabilidad en configuraciones extremas"

# ============================================================================
# PARÁMETROS DE SUAVIZADO Y FILTRADO
# ============================================================================
# Control de cómo se suavizan los ángulos para evitar movimientos espasmódicos

smoothing:
  # Factor alpha para filtro exponencial (0.0 = solo valores previos, 1.0 = solo nuevos)
  exponential_alpha: 0.2
  
  # Ventana de media móvil (número de frames para promediar)
  moving_average_window: 5

# ============================================================================
# PARÁMETROS DE VALIDACIÓN Y LOGGING
# ============================================================================

validation:
  # Ángulo máximo de flexión de codo permitido (radianes)
  # π radianes = 180° = completamente extendido
  # 0 radianes = 0° = completamente flexionado
  max_elbow_flexion: 3.14159  # radianes (π)
  
  # Confianza mínima requerida en detección de puntos corporales
  min_detection_confidence: 0.5
  
  # Umbral de singularidad (distancia mínima entre hombro y codo)
  singularity_threshold: 0.02  # metros

logging:
  # Throttle para logs (solo imprimir cada N ms)
  throttle_warning_ms: 1000
  throttle_debug_ms: 1000
  
  # Verbosidad
  log_level: "WARN"  # DEBUG, INFO, WARN, ERROR
  
  # Habilitar estadísticas periódicas
  enable_statistics: true
  statistics_interval_seconds: 5

# ============================================================================
# PARÁMETROS DE TRAYECTORIA Y CONTROL
# ============================================================================

trajectory:
  # Número de puntos de interpolación en cada trayectoria
  interpolation_steps: 15
  
  # Duración total de cada movimiento (segundos)
  duration_seconds: 1.0
  
  # Tipo de curva de suavizado
  ease_curve: "cubic_smoothstep"  # cubic_smoothstep, linear, quadratic
  
  # Frecuencia de envío de comandos
  command_update_rate_hz: 3.33  # (300ms)

# ============================================================================
# CALIBRACIÓN INICIAL
# ============================================================================
# Factores de escala y offset para compensar diferencias humano-robot

calibration:
  # Escala de conversión de ángulos (por si la relación no es 1:1)
  shoulder_scale: 1.0
  elbow_scale: 1.0
  
  # Offsets que se restan de los ángulos detectados
  shoulder_offset_deg: 0.0
  elbow_offset_deg: 0.0
  
  # Inversión de dirección (para compensar diferencias de geometría)
  invert_shoulder_azimuth: false
  invert_elbow_rotation: false
